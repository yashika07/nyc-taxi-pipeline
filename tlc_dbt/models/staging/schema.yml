version: 2

models:
  - name: stg_yellow_tripdata
    description: "All 3 months of yellow taxi trips, unioned into one clean table."
    columns:
      - name: vendor_id
        description: "ID of the taxi vendor/provider."
        tests:
          - not_null

      - name: pickup_datetime
        description: "Trip start timestamp (converted from raw microseconds)."
        tests:
          - not_null

      - name: dropoff_datetime
        description: "Trip end timestamp (converted from raw microseconds)."
        tests:
          - not_null

      - name: pickup_location_id
        description: "Foreign key to the taxi zone lookup table."
        tests:
          - not_null

      - name: dropoff_location_id
        description: "Foreign key to the taxi zone lookup table."
        tests:
          - not_null

      - name: total_amount
        description: "Total charged to the passenger for the trip."
        tests:
          - not_null

  - name: stg_yellow_tripdata_2026_03
    description: "March 2026 yellow taxi trips, cleaned and typed."

  - name: stg_yellow_tripdata_2026_04
    description: "April 2026 yellow taxi trips, cleaned and typed."

  - name: stg_yellow_tripdata_2026_05
    description: "May 2026 yellow taxi trips, cleaned and typed."

  - name: stg_taxi_zone_lookup
    description: "Taxi zone reference data - maps location IDs to boroughs/zones."
    columns:
      - name: location_id
        description: "Primary key for a taxi zone."
        tests:
          - unique
          - not_null
